spring.application.name=backend

# ---- MySQL (values resolved from .env at startup by BackendApplication.main) ----
spring.datasource.url=${AMAZON_RDS_URL}
spring.datasource.username=${AMAZON_RDS_USERNAME}
spring.datasource.password=${AMAZON_RDS_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Redis (values resolved from .env) ----
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USERNAME}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=2000ms
spring.cache.type=redis

# DevTools' RestartClassLoader creates a separate ClassLoader for app code,
# which causes JDK-serialized cache values to fail with ClassCastException on
# every hit (cached objects come back as the "wrong" Class). Disable restart
# so the cache layer works whether launched from IntelliJ or `mvnw`.
spring.devtools.restart.enabled=false
